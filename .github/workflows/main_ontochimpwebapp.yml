# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# 2026-08-07 SMS adapting to activate the Quasar build step

name: Build and deploy Node.js app to Azure Web App - OntoChimpWebapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Build Quasar SPA
        run: npm run build

      - name: Upload Quasar build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dist/spa
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2EC9A9ABCB9141DD8C52E9766A96715D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E13A859295934557B0A61F32E248EDD9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_87F49DEC89104422AA56D867F686798A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "OntoChimpWebapp"
          slot-name: "Production"
          package: .